name: ci

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: qjs-native-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build
        run: |
          cd quickjs
          make -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y
          cd ..
          mkdir -p release
          gcc -Os \
              src/qjs-native.c quickjs/libquickjs.a \
              -Iquickjs -lm -lpthread -ldl \
              -o "release/qjs-native-linux"
      - uses: actions/upload-artifact@v4
        with:
          name: qjs-native-linux
          path: release/qjs-native-linux
          if-no-files-found: error

  linux-32bit:
    name: Linux 32bit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install gcc-multilib
        run: |
          sudo apt update
          sudo apt install -y gcc-multilib
      - name: Build
        run: |
          cd quickjs
          make -j$(getconf _NPROCESSORS_ONLN) CONFIG_WERROR=y CONFIG_M32=y
          cd ..
          mkdir -p release
          gcc -m32 -Os \
              src/qjs-native.c quickjs/libquickjs.a \
              -Iquickjs -lm -lpthread -ldl \
              -o "release/qjs-native-linux-32"
      - uses: actions/upload-artifact@v4
        with:
          name: qjs-native-linux-32
          path: release/qjs-native-linux-32
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build Apple Silicon binary
        run: |
          mkdir -p release
          make -C quickjs clean
          make -C quickjs CONFIG_WERROR=y CC="clang -arch arm64" libquickjs.a
          clang -arch arm64 -Os \
              src/qjs-native.c quickjs/libquickjs.a \
              -Iquickjs -lm -lpthread \
              -o "release/qjs-native-macos"
      - name: Build Intel binary
        run: |
          make -C quickjs clean
          make -C quickjs CONFIG_WERROR=y CC="clang -arch x86_64" libquickjs.a
          clang -arch x86_64 -Os \
              src/qjs-native.c quickjs/libquickjs.a \
              -Iquickjs -lm -lpthread \
              -o "release/qjs-native-macos-intel"
      - name: Create universal binary
        run: |
          lipo -create \
              release/qjs-native-macos \
              release/qjs-native-macos-intel \
              -output release/qjs-native-macos-universal
          lipo release/qjs-native-macos-universal -verify_arch arm64
          lipo release/qjs-native-macos-universal -verify_arch x86_64
      - name: Build universal macOS launcher
        run: |
          launcher_build="$(mktemp -d)"
          trap 'rm -rf "$launcher_build"' EXIT
          swiftc -parse-as-library -O \
              -target arm64-apple-macos11.0 \
              src/launcher.swift \
              -o "$launcher_build/launcher-arm64"
          swiftc -parse-as-library -O \
              -target x86_64-apple-macos10.15 \
              src/launcher.swift \
              -o "$launcher_build/launcher-x86_64"
          lipo -create \
              "$launcher_build/launcher-arm64" \
              "$launcher_build/launcher-x86_64" \
              -output release/qjs-native-launcher
          lipo release/qjs-native-launcher -verify_arch arm64
          lipo release/qjs-native-launcher -verify_arch x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: qjs-native-macos
          path: release/qjs-native-macos*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: qjs-native-launcher
          path: release/qjs-native-launcher
          if-no-files-found: error

  mingw-windows:
    name: MinGW Windows target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install MinGW and Wine
        run: |
          sudo apt update
          sudo apt install -y wine mingw-w64
          cp /usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll quickjs/
      - name: Setup Wine
        run: |
          wine --version
          winecfg /v
      - name: Build
        run: |
          cd quickjs
          make CONFIG_WIN32=y
          cd ..
          mkdir -p release
          x86_64-w64-mingw32-gcc -Os \
              src/qjs-native.c quickjs/libquickjs.a \
              -Iquickjs -lm \
              -Wl,-Bstatic -lpthread -Wl,-Bdynamic -lmingw32 \
              -o "release/qjs-native.exe"
          x86_64-w64-mingw32-strip "release/qjs-native.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: qjs-native-windows
          path: release/qjs-native.exe
          if-no-files-found: error

  mingw-windows-32:
    name: MinGW Windows 32-bit target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install MinGW and Wine
        run: |
          sudo apt update
          sudo apt install -y wine mingw-w64
          cp /usr/i686-w64-mingw32/lib/libwinpthread-1.dll quickjs/
      - name: Setup Wine
        run: |
          wine --version
          winecfg /v
      - name: Build
        run: |
          cd quickjs
          make CONFIG_WIN32=y CONFIG_M32=y
          cd ..
          mkdir -p release
          i686-w64-mingw32-gcc -Os \
              src/qjs-native.c quickjs/libquickjs.a \
              -Iquickjs -lm \
              -Wl,-Bstatic -lpthread -Wl,-Bdynamic -lmingw32 \
              -o "release/qjs-native-32.exe"
          i686-w64-mingw32-strip "release/qjs-native-32.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: qjs-native-windows-32
          path: release/qjs-native-32.exe
          if-no-files-found: error

  publish-binaries:
    name: Commit release binaries
    runs-on: ubuntu-latest
    needs:
      - linux
      - linux-32bit
      - macos
      - mingw-windows
      - mingw-windows-32
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: qjs-native-*
          path: release
          merge-multiple: true
      - name: Restore executable permissions
        run: |
          chmod +x \
            release/qjs-native-linux \
            release/qjs-native-linux-32 \
            release/qjs-native-macos \
            release/qjs-native-macos-intel \
            release/qjs-native-macos-universal \
            release/qjs-native-launcher
      - name: Commit and push binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/qjs-native-*
          if git diff --cached --quiet; then
            echo "Release binaries are already up to date"
            exit 0
          fi
          git commit -m "chore: update release binaries"
          git push origin HEAD:main
